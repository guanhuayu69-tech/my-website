# 普健堂生产站点模板
#
# 使用前必须替换以下占位符，并确认对应文件真实存在：
#   __TLS_FULLCHAIN_FILE__  例：/etc/nginx/ssl/example/fullchain.pem
#   __TLS_PRIVATE_KEY_FILE__ 例：/etc/nginx/ssl/example/privkey.pem
#   __ACME_CHALLENGE_ROOT__  例：/var/www/acme
#
# 本文件应放入 Nginx 的 http 上下文（多数发行版为 /etc/nginx/conf.d/）。

limit_req_zone $binary_remote_addr zone=pujiantang_chat_rate:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=pujiantang_chat_conn:10m;

upstream pujiantang_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 保留 ACME 验证路径，其余 HTTP 请求统一跳转到根域 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name pujiantcm.com.cn www.pujiantcm.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_CHALLENGE_ROOT__;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pujiantcm.com.cn$request_uri;
    }
}

# www 只作为别名，永久跳转至根域。证书必须同时覆盖根域和 www。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pujiantcm.com.cn;

    ssl_certificate __TLS_FULLCHAIN_FILE__;
    ssl_certificate_key __TLS_PRIVATE_KEY_FILE__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PUJIANTANG_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    return 301 https://pujiantcm.com.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pujiantcm.com.cn;
    server_tokens off;

    ssl_certificate __TLS_FULLCHAIN_FILE__;
    ssl_certificate_key __TLS_PRIVATE_KEY_FILE__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PUJIANTANG_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 32k;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    # AI 咨询接口单独限速、限并发，避免单个来源占满服务。
    location = /api/chat {
        limit_req zone=pujiantang_chat_rate burst=4 nodelay;
        limit_req_status 429;
        limit_conn pujiantang_chat_conn 2;
        limit_conn_status 429;

        proxy_pass http://pujiantang_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # 页面与静态资源仍由本机 Node 服务统一提供。
    location / {
        proxy_pass http://pujiantang_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }
}
